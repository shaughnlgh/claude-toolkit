# Mechanical acceptance battery on every PR and main push. Deliberately secretless
# and read-only: a compromised write account that edits this workflow gains nothing
# beyond runner minutes. Runs on macOS to match the toolkit's target platform
# (verify.sh is only exercised against BSD userland).
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # verify.sh's manifest check shells out to `claude plugin validate` (skips
      # if absent). Install the CLI so CI validates for real; needs no API auth.
      - run: npm install -g @anthropic-ai/claude-code
      - run: bash verify.sh

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # gitleaks-action lists the PR's commits via the API on pull_request events;
      # without this the job 403s before scanning anything. Read keeps the
      # workflow's no-write posture — PR comments stay disabled below.
      pull-requests: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # full history so pushed/PR commit ranges can be scanned, not just HEAD
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # commenting on PRs needs pull-requests: write; findings still fail the
          # check and appear in the job summary without it
          GITLEAKS_ENABLE_COMMENTS: false
